services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shopmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - shopmate_pgdata:/var/lib/postgresql/data
volumes:
  shopmate_pgdata:
